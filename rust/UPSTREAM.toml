# The pin of an imported toolchain. tools/upstream.py fetches and verifies it.
[upstream]
name    = "Rust"
kind    = "git"
repo    = "https://github.com/EmiBSD/rust"           # the organisation's mirror, always
origin  = "https://github.com/rust-lang/rust"          # what the mirror is fed from
path    = []
commit  = "48a229ceaefd4985c50990b14116b6d856af0985"   # the commit tag 1.98.1 points to (18ed059b is the annotated tag object)
tag     = "1.98.1"                 # resolved to a commit at fetch, recorded in upstream/.pin
version = "1.98.1+emibsd.1"        # the upstream's version, plus our patch level
license = ["Apache-2.0", "MIT"]   # the families; the texts stay in the source

[security]
cpe     = "rust-lang:rust"            # NVD product, for tools/cve.py

[patches]
series  = []                              # patches/NNNN-*.patch, in order; each with its reason

[[submodules]]                            # fetched from the mirror at this commit, in place of the upstream's URL
path    = "src/tools/cargo"
repo    = "https://github.com/EmiBSD/cargo"
origin  = "https://github.com/rust-lang/cargo"
commit  = "797e8a9bca276c1c9f9f738d2a20f484fa4eea9d"

# One LLVM (decision D-0003, 2026-10-31): rustc is built against llvm/'s LLVM through
# `llvm-config` (`[target.*] llvm-config` in x.py's config.toml, `llvm.download-ci-llvm = false`),
# as distributions build it against a system LLVM; rustc 1.98.1 requires LLVM >= 21
# (src/bootstrap/src/core/build_steps/llvm.rs, check_llvm_version). Its own src/llvm-project
# submodule is not pinned and not fetched. Built with x.py, host first, then the target
# aarch64-unknown-openbsd: the std for the tier 3 target is built as part of the toolchain,
# from a stable release's source, without nightly. Stage0: rustup's rustc on the host; on
# EmiBSD, the previous DevTools release. library/backtrace is a submodule std needs; its
# mirror (rust-lang/backtrace-rs) is to be created before T2 and pinned here.

[watch]                                   # tools/watch.py: where a newer release is announced; it reports, never bumps
source  = "github-releases"               # the origin's GitHub releases (tag_name against `version` before "+")
